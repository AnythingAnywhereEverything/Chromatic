events {}

http {
    limit_req_zone $binary_remote_addr zone=login_zone:10m rate=1r/m;
    limit_req_status 429;

    proxy_cache_path /var/cache/nginx/cdn
        levels=1:2
        keys_zone=cdn_cache:100m
        max_size=10g
        inactive=30d
        use_temp_path=off;

    server {
        listen 80;
        server_name localhost;
        
        # listen 443 ssl;

        # ssl_certificate /etc/nginx/ssl/cloudflare.crt;
        # ssl_certificate_key /etc/nginx/ssl/cloudflare.key;

        client_max_body_size 10M;

        root /usr/share/nginx/html;
        index index.html;

        location = /login_rate_limited {
            default_type application/json;
            add_header Retry-After 600 always;
            return 429 '{"error":"Too many login attempts. Try again in 10 minutes."}';
        }

        location = /api/v2/auth/login {
            limit_req zone=login_zone burst=3 nodelay;
            error_page 429 = /login_rate_limited;

            proxy_pass http://rust:3000/v2/auth/login;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
        }


        location / {
            proxy_pass http://nextjs:5173;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Proxy API calls
        location /api/ {
            proxy_pass http://rust:3000/;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Proxy for Elixir
        location /ws/ {
            proxy_pass http://192.168.1.39:4000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # Proxy for cdn/media files
        location /cdn/ {
            proxy_pass http://rust:3000/v1/protected/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_cache cdn_cache;
            proxy_cache_key "$scheme://$host$request_uri";
            proxy_cache_valid 200 30d;
            proxy_cache_valid 404 1m;
            proxy_cache_valid 500 1m;
            proxy_cache_lock on;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000" always;
            add_header X-Cache-Status $upstream_cache_status always;
        }


        location ^~ /api/v1/protected/ {
            return 404;
        }
    }
}
