name: Rust CI Pipeline

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

jobs:
    test:
        name: Run Rest API Tests
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:15
                env:
                    POSTGRES_DB: postgres
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

            redis:
                image: redis:7-alpine
                ports:
                    - 6379:6379
                options: >-
                    --health-cmd "redis-cli ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Install Native System Dependencies
              run: |
                  sudo apt-get update
                  sudo apt-get install -y build-essential pkg-config libvips-dev

            - name: Install Rust Toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Rust Cache Manager
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: "backend/rust-service -> target"

            - name: Generate Test Configuration File
              run: |
                  cd backend/rust-service
                  cp .env.example .env

                  # Replace file keys with the active CI credentials safely using sed
                  sed -i 's/^POSTGRES_USER=.*/POSTGRES_USER=postgres/' .env
                  sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=password/' .env
                  sed -i 's/^POSTGRES_HOST=.*/POSTGRES_HOST=localhost/' .env
                  sed -i 's/^POSTGRES_PORT=.*/POSTGRES_PORT=5432/' .env
                  sed -i 's/^POSTGRES_DB=.*/POSTGRES_DB=postgres/' .env
                  sed -i 's/^REDIS_HOST=.*/REDIS_HOST=localhost/' .env
                  sed -i 's/^REDIS_PORT=.*/REDIS_PORT=6379/' .env
                  sed -i 's/^SERVICE_PORT=.*/SERVICE_PORT=0/' .env

            - name: Run Test Suite
              working-directory: backend/rust-service
              run: cargo test
