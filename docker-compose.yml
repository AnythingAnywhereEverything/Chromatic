services:
  elixir:
    build: ./backend/elixir-service
    env_file:
      - .env_docker_global
      - .env_docker_elixir
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app

  rust:
    build: ./backend/rust-service
    env_file:
      - .env_docker_global
      - .env_docker_rust
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./media:/app/media
      - ./temp:/app/temp
    gpus: all
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "3000"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - app

  nextjs:
    build:
      context: ./frontend
      dockerfile: Dockerfile.nextjs
      args:
        NEXT_PUBLIC_CDN_URL: ${NEXT_PUBLIC_CDN_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_URL: ${NEXT_PUBLIC_URL}
        NEXT_PUBLIC_PHOENIX_SOCKET_URL: ${NEXT_PUBLIC_PHOENIX_SOCKET_URL}
        DOCKER: "true"
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5173/"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - app

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile.nginx
    ports:
      - "80:80"
    depends_on:
      nextjs:
        condition: service_healthy
      rust:
        condition: service_healthy
    volumes:
      - ./media:/etc/nginx/media
    networks:
      - app

networks:
  app:
    driver: bridge