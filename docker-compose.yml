services:
  elixir:
    build: ./backend/elixir-service
    env_file:
      - .env_docker_global
      - .env_docker_elixir
    ports:
      - "4000:4000"
    networks:
      - app

  rust:
    build: ./backend/rust-service
    env_file:
      - .env_docker_global
      - .env_docker_rust
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./media:/app/media
    networks:
      - app

  nextjs:
    build:
      context: ./frontend
      dockerfile: Dockerfile.nextjs
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        DOCKER: "true"
    ports:
      - "5175:5175"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5173"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile.nginx
    ports:
      - "80:80"
    depends_on:
      - nextjs
      - rust
    volumes:
      - ./media:/etc/nginx/media
    networks:
      - app

networks:
  app:
    driver: bridge